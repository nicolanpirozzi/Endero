# Cloudflare Worker del sito Endero. Si pubblica solo dopo l'ok esplicito del proprietario.
# Prima pubblicazione: `npx wrangler d1 create endero`, poi si incolla qui il database_id che restituisce.
name = "endero"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "endero"
database_id = "00000000-0000-0000-0000-000000000000"   # da sostituire dopo `wrangler d1 create endero`

# Le email dei moduli (worker/email.mjs). I segreti RESEND_API_KEY ed EMAIL_DESTINATARIO si mettono con
# `npx wrangler secret put …`, mai qui.
[vars]
EMAIL_MITTENTE = "Endero <noreply@endero.men>"
EMAIL_RISPOSTE = "info@endero.men"

[observability]
enabled = true

# Ogni notte il Worker cancella le richieste più vecchie di 24 mesi dall'ultima (worker/conservazione.mjs),
# come promette l'informativa privacy.
[triggers]
crons = ["17 3 * * *"]

# L'anteprima ha una configurazione sua: wrangler.anteprima.toml.
