# Cloudflare Worker del sito Endero. Si pubblica solo dopo l'ok esplicito del proprietario.
# Prima pubblicazione: `npx wrangler d1 create endero`, poi si incolla qui il database_id che restituisce.
name = "endero"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "endero"
database_id = "00000000-0000-0000-0000-000000000000"   # da sostituire dopo `wrangler d1 create endero`

[observability]
enabled = true

# Anteprima da mostrare prima della messa online: `npx wrangler deploy --env anteprima`.
# Worker separato (endero-anteprima), senza database: lì i moduli avvisano che non salvano.
[env.anteprima]
name = "endero-anteprima"
workers_dev = true
