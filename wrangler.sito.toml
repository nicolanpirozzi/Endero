# Il sito su endero.men (proprietario, 2026-11-24: «ho acquistato direttamente endero.men su Cloudflare… mettiamo
# tutto su quel dominio»). Per ora chiuso a Google («Prima chiuso»): stesse pagine dell'anteprima, ma il modulo salva
# le richieste nel database e le manda per email a Endero (worker/email.mjs).
#
#   URL_ANTEPRIMA=https://endero.men TURNSTILE_SITE_KEY=<chiave pubblica> PAGAMENTO_PROVA=1 node build/costruisci.mjs
#   npx wrangler deploy --config wrangler.sito.toml
#
# Come l'anteprima, i file stanno nell'archivio KV (Workers Sites): nell'ambiente di lavoro il caricamento degli
# "assets" viene rifiutato (CLAUDE.md, 2026-11-15). Segreti, mai qui: TURNSTILE_SECRET, RESEND_API_KEY,
# EMAIL_DESTINATARIO (`npx wrangler secret put <nome> --config wrangler.sito.toml`). Per l'ordine del configuratore
# (worker/ordine.mjs), da mettere solo quando si accende il pagamento: STRIPE_SECRET_KEY (chiave segreta di Stripe),
# STRIPE_WEBHOOK_SECRET (la chiave del webhook che chiama https://endero.men/api/stripe), EMAIL_ORDINI (chi riceve gli
# ordini: Endero ed Ennio, separati da virgola; se manca, EMAIL_DESTINATARIO). Senza STRIPE_SECRET_KEY il pagamento è
# spento e gli ordini non si salvano.
name = "endero-sito"
main = "worker/anteprima.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "endero.men", custom_domain = true },
  { pattern = "www.endero.men", custom_domain = true },
]

[site]
bucket = "./dist"
exclude = ["_headers", "_redirects"]

[[d1_databases]]
binding = "DB"
database_name = "endero-sito"
database_id = "9cd0a738-00d2-4d2d-997a-bf0a12a43ac2"

# La configurazione riservata del Worker: lo stesso archivio KV dei questionari (endero-domande, wrangler.domande.toml).
# Il sito ci legge soltanto due voci: "riservato/taglie" (le camicie campione delle otto taglie, worker/taglie.mjs) e
# "riservato/tessuti" (il nome vero di ogni tessuto nella cartella colori, per l'email dell'ordine a Endero).
[[kv_namespaces]]
binding = "RISERVATO"
id = "a44b8c9d71cf4ed8852df3bbf3f73c76"

[vars]
EMAIL_MITTENTE = "Endero <noreply@endero.men>"
EMAIL_RISPOSTE = "info@endero.men"
# Il pagamento di prova (proprietario, 2026-11-27: «per stripe crea solo una demo poi lo collegheremo»): finché non c'è
# STRIPE_SECRET_KEY, l'ordine si «paga» su una pagina nostra che dice chiaro che è una prova, e arriva a Endero segnato
# PROVA (worker/ordine.mjs). Il build della pagina va fatto con PAGAMENTO_PROVA=1 (gli avvisi al passo Pagamento e nel
# grazie). Quando arriva Stripe: si tolgono questa riga e la variabile del build, e si mettono le due chiavi.
PAGAMENTO_PROVA = "1"

[observability]
enabled = true

# Ogni notte via le richieste più vecchie di 24 mesi dall'ultima (worker/conservazione.mjs), come promette l'informativa.
[triggers]
crons = ["17 3 * * *"]
