<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Domande · Endero</title>
<style nonce="__CASUALE__">
  /* Chi risponde non è pratico di tecnologia: si apre e c'è già la prima domanda. Una domanda per schermata, letta
     dall'alto in basso: il pezzo del foglio, due righe, la risposta con tasti grandi. Niente da scegliere prima,
     niente da scorrere di lato, niente da mandare alla fine. */
  @font-face { font-family: "Archivo"; src: url("/_/archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root {
    --carta: #f2f4f8; --foglio: #ffffff; --inchiostro: #101f3f; --tenue: #55617d; --riga: #d6dce8;
    --blu: #1b3c7e; --su-blu: #ffffff; --velo: #eaf0fb;
    --verde: #1f7a4d; --verde-fondo: #dff3e7; --ambra: #8a5a00; --ambra-fondo: #fff1cf; --rosso: #a3261c; --rosso-fondo: #fde8e5;
    --testo: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --cifre: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --carta: #0b1221; --foglio: #121b2f; --inchiostro: #e8edf8; --tenue: #a3b0c9; --riga: #2b3854;
      --blu: #9bbcff; --su-blu: #0b1221; --velo: #18243d;
      --verde: #7fd6a6; --verde-fondo: #14352a; --ambra: #ffd27a; --ambra-fondo: #3a2c08; --rosso: #ff9a8f; --rosso-fondo: #3b1512;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--carta); color: var(--inchiostro);
    font-family: var(--testo); font-size: 18px; line-height: 1.5;
    padding-block: 18px 72px;
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
  .pagina { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  p { margin: 0; }
  [hidden] { display: none !important; }

  /* in cima: a che punto si è */
  .cima { display: flex; flex-direction: column; gap: 8px; }
  .dove { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .occhiello { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tenue); font-weight: 700; }
  .conta { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .barra { height: 8px; border-radius: 4px; background: var(--riga); overflow: hidden; }
  .barra span { display: block; height: 100%; width: 0; background: var(--blu); transition: width 250ms ease; }
  .prova { padding: 10px 14px; border-radius: 8px; background: var(--ambra-fondo); color: var(--ambra); font-size: 16px; font-weight: 600; }

  /* la domanda */
  .passo { background: var(--foglio); border: 1px solid var(--riga); border-radius: 12px; padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-stretch: 114%; font-weight: 700; font-size: clamp(24px, 6vw, 32px); line-height: 1.12; margin: 0; text-wrap: balance; text-transform: uppercase; letter-spacing: 0.01em; }
  h1:focus { outline: none; }
  h2 { font-stretch: 112%; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 10px 0 0; }
  .gia { align-self: flex-start; font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--verde-fondo); color: var(--verde); }

  /* il pezzo del foglio: se è troppo largo per lo schermo va a capo in due o tre strisce, come una riga di testo */
  figure { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  figcaption { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tenue); }
  .pezzo { display: flex; flex-direction: column; gap: 4px; min-height: 40px; }
  .striscia { overflow: hidden; border: 1px solid var(--riga); border-radius: 6px; background: #e9edf3; }
  .striscia img { display: block; max-width: none; height: auto; }

  .etichetta { display: block; font-size: 15px; font-weight: 600; color: var(--tenue); margin-bottom: -8px; }
  .proposta { font-size: 20px; line-height: 1.4; font-weight: 500; padding: 14px 16px; border-radius: 10px; background: var(--velo); border-left: 5px solid var(--blu); overflow-wrap: anywhere; white-space: pre-line; }
  .nota { font-size: 16px; color: var(--tenue); }
  .domanda { display: block; font-size: 21px; font-weight: 700; line-height: 1.3; margin-top: 4px; }

  /* le risposte: tasti grandi, uno sotto l'altro */
  .scelte { display: flex; flex-direction: column; gap: 10px; }
  button { font: 700 19px/1.25 var(--testo); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--blu); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: default; }
  .scelta { width: 100%; min-height: 60px; padding: 14px 18px; text-align: left; border: 2px solid var(--blu); border-radius: 12px; background: var(--foglio); color: var(--blu); }
  .scelta:hover { background: var(--velo); }
  .scelta--presa, .scelta--presa:hover { background: var(--blu); color: var(--su-blu); }
  .scelta--presa::before { content: "✓  "; }
  .conferma { align-self: flex-start; min-height: 60px; min-width: 190px; padding: 14px 28px; border: 2px solid var(--blu); border-radius: 12px; background: var(--blu); color: var(--su-blu); }
  .secondo { align-self: flex-start; min-height: 52px; padding: 12px 18px; border: 2px solid var(--riga); border-radius: 12px; background: transparent; color: var(--blu); font-weight: 600; font-size: 17px; }
  .altro { display: flex; flex-direction: column; gap: 12px; }
  .altro label { font-size: 17px; font-weight: 600; }
  textarea, input[type="text"] { width: 100%; font: 400 19px/1.45 var(--testo); color: var(--inchiostro); background: var(--carta); border: 2px solid var(--blu); border-radius: 10px; padding: 12px 14px; }
  textarea { min-height: 150px; resize: vertical; }
  textarea:focus-visible, input[type="text"]:focus-visible { outline: 3px solid var(--blu); outline-offset: 1px; }
  .quanto { display: flex; align-items: center; gap: 12px; }
  input[type="text"].numero { width: 150px; font: 600 30px/1.2 var(--cifre); text-align: right; padding: 10px 14px; }
  .quanto .unita { font: 600 24px/1 var(--testo); }
  .esempio { font-size: 17px; color: var(--tenue); min-height: 26px; }
  .errore { font-size: 17px; font-weight: 700; color: var(--rosso); }

  .salvataggio { font-size: 16px; color: var(--tenue); min-height: 24px; text-align: center; }
  .salvataggio[data-tipo="fatto"] { color: var(--verde); font-weight: 700; }
  .salvataggio[data-tipo="errore"] { color: var(--rosso); font-weight: 700; }
  .passi { display: flex; justify-content: space-between; gap: 12px; }
  .quieto { min-height: 52px; padding: 10px 16px; border: 0; border-radius: 10px; background: transparent; color: var(--blu); font-weight: 600; font-size: 18px; }
  .quieto:hover { background: var(--velo); }

  /* la fine */
  .esito { padding: 16px 18px; border-radius: 10px; background: var(--verde-fondo); color: var(--verde); font-size: 20px; font-weight: 700; }
  .esito[data-tipo="errore"] { background: var(--rosso-fondo); color: var(--rosso); }
  .esito[data-tipo="neutro"] { background: var(--ambra-fondo); color: var(--ambra); }
  .riepilogo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .riepilogo li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--riga); }
  .riepilogo li:last-child { border-bottom: 0; }
  .riepilogo .nome { font-weight: 700; }
  .riepilogo .data { grid-column: 1; font-size: 17px; color: var(--tenue); overflow-wrap: anywhere; white-space: pre-line; }
  .riepilogo .manca { color: var(--ambra); font-weight: 600; }
  .riepilogo button { grid-row: 1 / span 2; grid-column: 2; }
  .copia { display: flex; flex-direction: column; gap: 10px; }
  .copia textarea { min-height: 150px; font-size: 14px; }

  @media (max-width: 640px) { .passo { padding: 18px 14px 20px; } }
  @media (prefers-reduced-motion: reduce) { .barra span { transition: none; } }
</style>
</head>
<body>
<main class="pagina">
  <header class="cima">
    <div class="dove">
      <p class="occhiello" id="gruppo">Endero</p>
      <p class="conta" id="conta"></p>
    </div>
    <div class="barra" aria-hidden="true"><span id="barra"></span></div>
  </header>
  <p class="prova" id="prova" hidden>Prova: qui le risposte non vengono salvate.</p>
  <section class="passo" id="passo"><p>Un attimo…</p></section>
  <p class="salvataggio" id="salvataggio" role="status" aria-live="polite"></p>
  <nav class="passi" id="passi" aria-label="Domande" hidden>
    <button type="button" class="quieto" id="indietro">‹ Indietro</button>
    <button type="button" class="quieto" id="avanti">Salta ›</button>
  </nav>
  <noscript><p>Questa pagina non si apre con questo programma: aprila con Chrome o Safari.</p></noscript>
</main>

<script nonce="__CASUALE__">
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const crea = (tag, classe, testo) => { const e = document.createElement(tag); if (classe) e.className = classe; if (testo != null) e.textContent = testo; return e; };
  const tasto = (testo, classe, id) => { const b = crea('button', classe, testo); b.type = 'button'; if (id) b.id = id; return b; };
  const cifra = (n) => String(n).replace('.', ',');
  const avviso = (testo, tipo = '') => { const el = $('salvataggio'); el.textContent = testo; el.dataset.tipo = tipo; };
  const righe = (v) => (Array.isArray(v) ? v : v ? [v] : []);

  // ------------------------------------------------------------------ stato
  let Q = null, PASSI = [], N = 0, POSTO = '';
  const risposte = {};        // id -> la risposta che si vede
  const daMandare = {};       // id -> risposta non ancora arrivata al server
  const mandate = {};         // id -> quando è arrivata: per un paio di minuti il server può ancora rileggere quella vecchia
  // con ?prova in fondo all'indirizzo si guarda la pagina senza salvare niente (per chi la controlla, non per chi risponde)
  const prova = new URLSearchParams(location.search).has('prova');
  let qui = 0;                // da 0 a N-1 le domande · N la fine
  let figure = [];            // i pezzi di foglio della schermata, da risistemare se lo schermo cambia larghezza

  const fatta = (id) => Boolean(risposte[id] && risposte[id].stato);
  const fatte = () => PASSI.filter((p) => fatta(p.id)).length;
  const primaAperta = () => { const k = PASSI.findIndex((p) => !fatta(p.id)); return k < 0 ? N : k; };
  const barra = () => { $('barra').style.width = `${N ? Math.round(fatte() / N * 100) : 0}%`; };

  // sul dispositivo resta una copia delle risposte date da qui: se la rete cade non si perde niente
  function tieni() {
    if (prova) return;
    try { localStorage.setItem(POSTO, JSON.stringify({ risposte, daMandare: Object.keys(daMandare), mandate })); } catch { /* resta in memoria finché la pagina è aperta */ }
  }
  function tenute() { try { return JSON.parse(localStorage.getItem(POSTO) || 'null') || {}; } catch { return {}; } }

  function numero(s, min, max) {
    const t = String(s).trim().replace(',', '.');
    if (!/^\d{1,3}(\.\d{1,2})?$/.test(t)) return null;
    const n = parseFloat(t);
    return n >= min && n <= max ? n : null;
  }

  // Il pezzo del foglio. La scrittura a mano deve restare leggibile: se l'immagine è troppo larga per lo schermo
  // non si rimpicciolisce e non si fa scorrere di lato, ma va a capo in due o tre strisce che si sovrappongono un po'.
  const SOPRA = 0.12;                                           // quanto una striscia ripete della precedente
  const parte = (k) => 1 / (k - (k - 1) * SOPRA);               // quanta parte dell'immagine sta in una striscia
  function figura([file, dida]) {
    const f = crea('figure'), pezzo = crea('div', 'pezzo'), im = new Image();
    im.alt = dida;
    const sistema = () => {
      const spazio = f.clientWidth, larga = im.naturalWidth;
      if (!spazio || !larga) return;
      let k = 1;
      while (k < 3 && spazio / (parte(k) * larga) < 0.42) k++;
      pezzo.style.maxWidth = k === 1 ? `${Math.round(larga * 0.8)}px` : '';
      if (pezzo.dataset.strisce === String(k)) return;
      pezzo.dataset.strisce = String(k);
      pezzo.replaceChildren();
      for (let i = 0; i < k; i++) {
        const s = crea('div', 'striscia'), copia = i === 0 ? im : im.cloneNode();
        if (i) copia.alt = '';
        copia.style.width = `${100 / parte(k)}%`;
        copia.style.marginLeft = `${-i * (1 - SOPRA) * 100}%`;
        s.append(copia); pezzo.append(s);
      }
    };
    im.addEventListener('load', sistema);
    figure.push(sistema);
    im.src = `ritagli/${file}.jpg`;
    f.append(crea('figcaption', '', dida), pezzo);
    return f;
  }
  window.addEventListener('resize', () => figure.forEach((s) => s()));

  // ------------------------------------------------------------------ una schermata
  function mostra(i, fuoco = true) {
    qui = Math.max(0, Math.min(N, i));
    const el = $('passo');
    el.replaceChildren();
    figure = [];
    $('passi').hidden = false;
    $('indietro').disabled = qui === 0;
    $('avanti').hidden = qui === N;
    barra();
    if (qui === N) { fine(el); if (fuoco) { el.querySelector('h1').focus({ preventScroll: true }); window.scrollTo({ top: 0 }); } return; }
    const p = PASSI[qui], r = risposte[p.id] || {};
    $('gruppo').textContent = p.gruppo;
    $('conta').textContent = `Domanda ${qui + 1} di ${N}`;
    $('avanti').textContent = fatta(p.id) ? 'Avanti ›' : 'Salta ›';

    const h = crea('h1', '', p.titolo); h.tabIndex = -1;
    el.append(h);
    if (fatta(p.id)) el.append(crea('p', 'gia', 'Hai già risposto: puoi cambiare'));
    for (const rit of p.ritagli || []) el.append(figura(rit));
    for (const riga of righe(p.testo)) el.append(crea('p', '', riga));

    if (p.tipo === 'numero') quanto(el, p, r); else if (p.tipo === 'scelta') scegli(el, p, r); else conferma(el, p, r);
    if (fuoco) { h.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); }
  }

  /** Il riquadro per scrivere a mano, con il suo tasto. Resta chiuso finché non serve. */
  function scriviQui(p, r, etichetta, partenza, quando) {
    const altro = crea('div', 'altro'); altro.hidden = true;
    const scritto = crea('textarea'); scritto.id = `t-${p.id}`; scritto.maxLength = 1500;
    const nome = crea('label', '', etichetta); nome.htmlFor = scritto.id;
    const ok = tasto('Conferma', 'conferma', `b-${p.id}`);
    altro.append(nome, scritto, ok);
    const apri = (conFuoco = true) => {
      altro.hidden = false;
      if (!scritto.value) scritto.value = (r.scelta === 'altro' && r.testo) || partenza || '';
      if (conFuoco) { scritto.focus(); altro.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    };
    ok.addEventListener('click', () => { const t = scritto.value.trim(); if (!t) { scritto.focus(); return; } quando(t); });
    if (r.scelta === 'altro') apri(false);
    return { altro, apri };
  }

  // una proposta da approvare: «Sì, va bene» oppure «No, la cambio» (e allora la si corregge, senza riscriverla da capo)
  function conferma(el, p, r) {
    if (p.etichetta) el.append(crea('p', 'etichetta', p.etichetta));
    el.append(crea('p', 'proposta', p.ipotesi));
    if (p.nota) el.append(crea('p', 'nota', p.nota));
    el.append(crea('p', 'domanda', p.domanda || 'È giusto?'));
    const scelte = crea('div', 'scelte');
    const { altro, apri } = scriviQui(p, r, p.scrivi || 'Scrivi qui com\'è giusto:', p.modifica ? p.ipotesi : '', (t) => {
      // chi apre il riquadro e lo lascia com'era ha confermato
      if (p.modifica && t === p.ipotesi) salva(p, { stato: 'confermato', scelta: 'conferma', testo: '' }, 'Confermo: ' + p.ipotesi);
      else salva(p, { stato: 'modificato', scelta: 'altro', testo: t }, t);
    });
    const tutte = [['conferma', p.conferma || 'Sì, è giusto'], ...(p.altre || []), ['altro', p.altro || 'No, lo scrivo io']];
    for (const [id, testo] of tutte) {
      const b = tasto(testo, 'scelta' + (r.scelta === id ? ' scelta--presa' : ''), `r-${p.id}-${id}`);
      b.addEventListener('click', () => {
        if (id === 'altro') { apri(); return; }
        segna(scelte, b);
        salva(p, { stato: id === 'conferma' ? 'confermato' : 'modificato', scelta: id, testo: '' }, id === 'conferma' ? 'Confermo: ' + p.ipotesi : testo);
      });
      scelte.append(b);
    }
    el.append(scelte, altro);
  }

  // una domanda con le risposte già scritte: se ne tocca una
  function scegli(el, p, r) {
    el.append(crea('p', 'domanda', p.domanda));
    const scelte = crea('div', 'scelte');
    const { altro, apri } = scriviQui(p, r, p.scrivi || 'Scrivi qui:', '', (t) => salva(p, { stato: 'risposto', scelta: 'altro', testo: t }, t));
    const tutte = [...p.scelte, ...(p.altro === false ? [] : [['altro', p.altro || 'Altro: lo scrivo io']])];
    for (const [id, testo] of tutte) {
      const b = tasto(testo, 'scelta' + (r.scelta === id ? ' scelta--presa' : ''), `r-${p.id}-${id}`);
      b.addEventListener('click', () => {
        if (id === 'altro') { apri(); return; }
        segna(scelte, b);
        salva(p, { stato: 'risposto', scelta: id, testo: '' }, testo);
      });
      scelte.append(b);
    }
    el.append(scelte, altro);
  }
  function segna(gruppo, scelto) { for (const b of gruppo.children) b.classList.toggle('scelta--presa', b === scelto); }

  /** Il testo che il cliente leggerà per misurarsi: quello approvato, o quello corretto nella domanda prima. */
  function ripresa(p) {
    const da = PASSI.find((x) => x.id === p.riprende);
    if (!da) return '';
    const r = risposte[da.id];
    return r && r.scelta === 'altro' && r.testo ? r.testo : da.ipotesi;
  }

  // un numero da scrivere (i centimetri), oppure due righe se un numero fisso non c'è
  function quanto(el, p, r) {
    const min = p.min ?? 0, max = p.max ?? 60, unita = p.unita || 'cm';
    const citato = ripresa(p);
    if (citato) el.append(crea('p', 'etichetta', p.etichettaRiprende || 'Il cliente si misura così:'), crea('p', 'proposta', citato));
    const cifre = crea('input', 'numero'); cifre.type = 'text'; cifre.inputMode = 'decimal'; cifre.autocomplete = 'off'; cifre.maxLength = 6; cifre.id = `n-${p.id}`;
    const domanda = crea('label', 'domanda', p.domanda); domanda.htmlFor = cifre.id;
    const riga = crea('div', 'quanto'); riga.append(cifre, crea('span', 'unita', unita));
    const esempio = crea('p', 'esempio'); esempio.id = `e-${p.id}`;
    const errore = crea('p', 'errore'); errore.id = `x-${p.id}`; errore.hidden = true; errore.setAttribute('role', 'alert');
    const ok = tasto('Conferma', 'conferma', `b-${p.id}`);
    const { altro, apri } = scriviQui({ id: p.id + '-a' }, r, p.scrivi || 'Spiega qui come si decide:', '', (t) => salva(p, { stato: 'risposto', scelta: 'altro', testo: t }, t));
    const dipende = tasto(p.altro || 'Dipende: lo spiego io', 'secondo', `a-${p.id}`);

    const conta = () => {
      errore.hidden = true;
      if (!p.esempio) return;
      const n = numero(cifre.value, min, max);
      esempio.textContent = n === null ? (p.esempio.vuota || '') : p.esempio.frase.replaceAll('{n}', cifra(n)).replaceAll('{r}', cifra(Math.round(((p.esempio.da || 0) - n) * 10) / 10));
    };
    const scrivi = () => {
      const n = numero(cifre.value, min, max);
      if (n === null) { errore.textContent = `Scrivi un numero da ${cifra(min)} a ${cifra(max)}. Per esempio 8, oppure 1,5.`; errore.hidden = false; cifre.focus(); return; }
      salva(p, { stato: 'risposto', scelta: 'numero', valore: n, testo: '' }, `${cifra(n)} ${unita}`);
    };
    cifre.addEventListener('input', conta);
    cifre.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); scrivi(); } });
    ok.addEventListener('click', scrivi);
    dipende.addEventListener('click', () => apri());
    if (r.scelta === 'numero' && r.valore != null) cifre.value = cifra(r.valore);
    conta();
    el.append(domanda, riga, esempio, errore, ok, dipende, altro);
  }

  // ------------------------------------------------------------------ la fine
  function fine(el) {
    $('gruppo').textContent = 'Fine';
    $('conta').textContent = `${fatte()} risposte su ${N}`;
    const mancano = N - fatte(), inCoda = Object.keys(daMandare).length;
    const h = crea('h1', '', mancano ? (mancano === 1 ? 'Manca una risposta' : `Mancano ${mancano} risposte`) : 'Fatto, grazie!'); h.tabIndex = -1;
    el.append(h);
    const esito = crea('p', 'esito'); esito.id = 'esito';
    if (prova) { esito.dataset.tipo = 'neutro'; esito.textContent = 'Era una prova: niente è stato salvato.'; }
    else if (inCoda) { esito.dataset.tipo = 'errore'; esito.textContent = inCoda === 1 ? 'Una risposta non è ancora arrivata. Controlla che il telefono sia collegato a internet e premi «Riprova».' : `${inCoda} risposte non sono ancora arrivate. Controlla che il telefono sia collegato a internet e premi «Riprova».`; }
    else if (mancano) { esito.dataset.tipo = 'neutro'; esito.textContent = 'Le risposte date fin qui sono salvate. Puoi finire anche più tardi, riaprendo lo stesso link.'; }
    else esito.textContent = 'Tutte le risposte sono arrivate. Puoi chiudere la pagina.';
    el.append(esito);
    if (!prova && inCoda) {
      // se la rete proprio non va, le risposte si possono copiare e mandare a mano
      const testo = [`RISPOSTE (${fatte()} su ${N}) · ${Q.titolo}`];
      for (const p of PASSI) testo.push(`[${p.id}] ${p.titolo} → ${fatta(p.id) ? risposte[p.id].risposta : '(senza risposta)'}`);
      const riquadro = crea('div', 'copia'), campo = crea('textarea'), ancora = tasto('Riprova', 'conferma', 'riprova'), copia = tasto('Copia le risposte', 'secondo'), detto = crea('p', 'nota', '');
      campo.readOnly = true; campo.value = testo.join('\n'); campo.setAttribute('aria-label', 'Tutte le risposte, da copiare');
      ancora.addEventListener('click', () => svuota());
      copia.addEventListener('click', () => {
        const seleziona = () => { campo.hidden = false; campo.focus(); campo.select(); detto.textContent = 'Il testo è selezionato: copialo e incollalo in un messaggio.'; };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(campo.value).then(() => { detto.textContent = 'Copiate. Incollale in un messaggio a chi ti ha mandato il link.'; }, seleziona); else seleziona();
      });
      campo.hidden = true;
      riquadro.append(ancora, copia, detto, campo); el.append(riquadro);
    }
    if (mancano) { const vai = tasto('Vai alla prima che manca', 'conferma', 'manca'); vai.addEventListener('click', () => mostra(primaAperta())); el.append(vai); }
    el.append(crea('h2', '', 'Le tue risposte'), crea('p', 'nota', 'Per cambiarne una premi «Cambia».'));
    const lista = crea('ul', 'riepilogo');
    PASSI.forEach((p, i) => {
      const li = crea('li'), c = fatta(p.id);
      const b = tasto(c ? 'Cambia' : 'Rispondi', 'secondo'); b.addEventListener('click', () => mostra(i));
      li.append(crea('span', 'nome', p.titolo), crea('span', 'data' + (c ? '' : ' manca'), c ? risposte[p.id].risposta.replace(/^Confermo: /, 'Va bene: ') : 'Manca la risposta'), b);
      lista.append(li);
    });
    el.append(lista);
  }

  // ------------------------------------------------------------------ il salvataggio
  function salva(p, r, risposta) {
    const dati = { ...r, risposta };
    risposte[p.id] = dati;
    barra();
    const da = qui;
    setTimeout(() => { if (qui === da) mostra(da + 1); }, 600);
    if (prova) return;
    daMandare[p.id] = dati; tieni(); svuota();
  }

  async function spedisci(id, dati) {
    const ferma = new AbortController(), tempo = setTimeout(() => ferma.abort(), 12000);
    try {
      const r = await fetch('risposta', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, ...dati }), signal: ferma.signal, cache: 'no-store' });
      if (r.ok) return 'ok';
      return r.status === 400 || r.status === 413 ? 'rifiutata' : 'no';
    } catch { return 'no'; } finally { clearTimeout(tempo); }
  }

  // le risposte partono una alla volta; se la rete cade restano in coda e si riprova da soli, sempre più di rado
  let inCorso = null, riprova = 0, attesa = 2000;
  function svuota() {
    if (inCorso || prova) return inCorso;
    clearTimeout(riprova);
    if (!Object.keys(daMandare).length) return null;
    inCorso = (async () => {
      let ferma = false, rifiutate = 0;
      while (!ferma) {
        const id = Object.keys(daMandare)[0];
        if (!id) break;
        const dati = daMandare[id];
        const esito = await spedisci(id, dati);
        if (esito === 'no') { ferma = true; continue; }
        if (esito === 'rifiutata') rifiutate++; else mandate[id] = Date.now();
        if (daMandare[id] === dati) delete daMandare[id];
        tieni();
      }
      inCorso = null;
      const n = Object.keys(daMandare).length;
      if (n) {
        avviso(n === 1 ? 'Internet non va: la risposta è al sicuro qui, riprovo da solo.' : `Internet non va: ${n} risposte sono al sicuro qui, riprovo da solo.`, 'errore');
        riprova = setTimeout(svuota, attesa); attesa = Math.min(attesa * 2, 30000);
      } else {
        attesa = 2000;
        if (rifiutate) avviso('Una risposta era troppo lunga: riscrivila più corta.', 'errore'); else avviso('✓ Risposta salvata', 'fatto');
      }
      if (qui === N) mostra(N, false);
    })();
    return inCorso;
  }
  window.addEventListener('online', () => { attesa = 2000; svuota(); });

  $('indietro').addEventListener('click', () => mostra(qui - 1));
  $('avanti').addEventListener('click', () => mostra(qui + 1));

  // ------------------------------------------------------------------ partenza: subito la prima domanda senza risposta
  (async () => {
    let lette = {}, letteBene = false;
    try {
      const [a, b] = await Promise.all([fetch('domande.json', { cache: 'no-store' }), fetch('risposte.json', { cache: 'no-store' }).catch(() => null)]);
      if (!a.ok) throw new Error('domande');
      Q = await a.json();
      if (b && b.ok) { lette = (await b.json()).risposte || {}; letteBene = true; }
    } catch {
      $('passo').replaceChildren(crea('p', 'esito', 'La pagina non si è aperta bene. Controlla che il telefono sia collegato a internet e riapri il link.'));
      $('passo').firstChild.dataset.tipo = 'errore';
      return;
    }
    PASSI = Q.passi; N = PASSI.length;
    POSTO = `endero-domande:${location.pathname}:${Q.giro || 1}`;
    document.title = `${Q.titolo} · Endero`;
    $('prova').hidden = !prova;
    const mie = prova ? {} : tenute(), ora = Date.now();
    for (const p of PASSI) {
      const mia = mie.risposte && mie.risposte[p.id];
      const inCoda = (mie.daMandare || []).includes(p.id), fresca = mie.mandate && ora - (mie.mandate[p.id] || 0) < 120000;
      if (mia && (inCoda || fresca || !lette[p.id])) {
        risposte[p.id] = mia;
        if (mie.mandate && mie.mandate[p.id]) mandate[p.id] = mie.mandate[p.id];
        // in coda, o data da qui ma non (ancora) sul server: si rimanda, non costa niente
        if (inCoda || (letteBene && !lette[p.id] && !fresca)) daMandare[p.id] = mia;
      } else if (lette[p.id]) risposte[p.id] = lette[p.id];
    }
    avviso(prova || letteBene ? (prova ? '' : 'Ogni risposta si salva da sola.') : 'Internet non va bene: le risposte restano al sicuro qui e partono appena torna.', prova || letteBene ? '' : 'errore');
    mostra(primaAperta(), false);
    svuota();
  })();
})();
</script>
</body>
</html>
